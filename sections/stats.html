
<!-- ======== TOP STATS ======== -->
<div class="stats-grid" id="stats" style="margin-top:40px;">
  <div class="stat-box">
    <div class="number" style="color:var(--accent-red);">{{statConfirmedDead}}</div>
    <div class="label">Confirmed Dead<br>({{statConfirmedDeadSource}})</div>
  </div>
  <div class="stat-box">
    <div class="number" style="color:var(--accent-orange);">{{statTotalKilled}}</div>
    <div class="label">Est. Total Killed<br>({{statTotalKilledSource}})</div>
  </div>
  <div class="stat-box">
    <div class="number" style="color:var(--accent-gold);">{{statDetained}}</div>
    <div class="label">Protesters<br>Detained</div>
  </div>
  <div class="stat-box">
    <div class="number" style="color:var(--accent-blue);">{{statUsAircraft}}</div>
    <div class="label">US Aircraft<br>Deployed</div>
  </div>
  <div class="stat-box">
    <div class="number" style="color:var(--accent-cyan);">{{statUsShips}}</div>
    <div class="label">US Navy Ships<br>in Region</div>
  </div>
  <div class="stat-box">
    <div class="number" style="color:var(--accent-green);">{{statRialRate}}</div>
    <div class="label">Rials per<br>US Dollar</div>
  </div>
</div>
