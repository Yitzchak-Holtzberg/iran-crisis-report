<script>
  document.documentElement.dataset.atlasRuntimeErrors = '[]';
  function recordAtlasRuntimeError(message) {
    var errors = JSON.parse(document.documentElement.dataset.atlasRuntimeErrors || '[]');
    errors.push(message);
    document.documentElement.dataset.atlasRuntimeErrors = JSON.stringify(errors);
  }
  window.addEventListener('error', function (event) {
    recordAtlasRuntimeError(event.message || 'Unknown page error');
  });
  window.addEventListener('unhandledrejection', function (event) {
    recordAtlasRuntimeError(String(event.reason || 'Unhandled promise rejection'));
  });
  try {
    if (localStorage.getItem('atlas-theme') === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  } catch (_) {}
  window.IRAN_REPORT_ASSET_PREFIX = '../';
  window.IRAN_REPORT_MAP_MODE = 'atlas-hero';
</script>
