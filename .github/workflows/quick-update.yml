name: Quick Data Patch

# Patch one or more data.json fields from the GitHub Actions UI — no local
# clone or AI pipeline required.  Useful for rapid corrections between
# scheduled AI updates.
#
# Only the fields you fill in are changed; leave a field blank to skip it.
# "ticker" accepts pipe-separated headlines (e.g. "HEADLINE 1|HEADLINE 2").

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date (e.g. "March 1, 2026") — blank to skip'
        required: false
        default: ''
      lastUpdated:
        description: 'Last updated time (e.g. "14:30 UTC") — blank to skip'
        required: false
        default: ''
      ticker:
        description: 'Breaking news — pipe-separated (e.g. "HEADLINE 1|HEADLINE 2") — blank to skip'
        required: false
        default: ''
      statUsTroops:
        description: 'US troops in region (e.g. "35,000+") — blank to skip'
        required: false
        default: ''
      statUsTroopsSource:
        description: 'US troops source (e.g. "Task & Purpose") — blank to skip'
        required: false
        default: ''
      statMissilesFired:
        description: 'Missiles fired (e.g. "~170") — blank to skip'
        required: false
        default: ''
      statMissilesFiredSource:
        description: 'Missiles fired source (e.g. "Crit. Threats") — blank to skip'
        required: false
        default: ''
      statCarrierGroups:
        description: 'Carrier strike groups (e.g. "3") — blank to skip'
        required: false
        default: ''
      statOilAtRisk:
        description: 'Oil at risk in Mbbl/d (e.g. "20M") — blank to skip'
        required: false
        default: ''
      statCitizensOffline:
        description: 'Citizens under internet blackout (e.g. "92M") — blank to skip'
        required: false
        default: ''
      statIrgcKilled:
        description: 'IRGC / military killed (e.g. "435+") — blank to skip'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Pass each input as a PATCH_<key> env var.  patch-data.js reads these
      # and skips any that are empty, so only filled-in fields are updated.
      - name: Patch data.json
        env:
          PATCH_date:                  ${{ github.event.inputs.date }}
          PATCH_lastUpdated:           ${{ github.event.inputs.lastUpdated }}
          PATCH_ticker:                ${{ github.event.inputs.ticker }}
          PATCH_statUsTroops:          ${{ github.event.inputs.statUsTroops }}
          PATCH_statUsTroopsSource:    ${{ github.event.inputs.statUsTroopsSource }}
          PATCH_statMissilesFired:     ${{ github.event.inputs.statMissilesFired }}
          PATCH_statMissilesFiredSource: ${{ github.event.inputs.statMissilesFiredSource }}
          PATCH_statCarrierGroups:     ${{ github.event.inputs.statCarrierGroups }}
          PATCH_statOilAtRisk:         ${{ github.event.inputs.statOilAtRisk }}
          PATCH_statCitizensOffline:   ${{ github.event.inputs.statCitizensOffline }}
          PATCH_statIrgcKilled:        ${{ github.event.inputs.statIrgcKilled }}
        run: node scripts/patch-data.js

      - name: Build HTML pages
        run: npm run build

      - name: Commit and push updated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          git add -A
          git diff --staged --quiet || git commit -m "chore: manual data patch $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
