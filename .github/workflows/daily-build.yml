name: Periodic Build & Deploy

# Runs every 6 hours so breaking news is caught within 6 hours rather than
# waiting up to 24 hours for the next nightly run.  Can also be triggered
# manually from the Actions tab ("Run workflow"), or immediately via a
# repository_dispatch webhook call with event_type "breaking-news".
on:
  schedule:
    - cron: '5 0,6,12,18 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [breaking-news]

# Required for committing back to the repo and for GitHub Pages deployment.
permissions:
  contents: write
  pages: write
  id-token: write

# Only one deployment should run at a time; cancel any in-progress run when a
# new one is triggered (e.g. from a manual dispatch overlapping the scheduler).
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Update data.json → date and lastUpdated to today's UTC date/time.
      - name: Update date in data.json
        run: node scripts/update-date.js

      # Pull the latest news with Tavily and update data.json + last-24h.html
      # via GPT-5-mini.  Uses continue-on-error so a quota or network issue
      # never blocks the date-refresh and rebuild from completing.
      - name: AI content update (Tavily + GPT-5-mini)
        continue-on-error: true
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/ai-update.js

      # Regenerate index.html from the updated data.json and section files.
      - name: Build index.html
        run: npm run build

      # Commit the refreshed files back to the branch so the repo always
      # reflects the latest auto-generated output.
      - name: Commit and push updated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json index.html sections/
          # Only commit when something actually changed (idempotent on re-runs).
          git diff --staged --quiet || git commit -m "chore: daily rebuild $(date -u +'%Y-%m-%d')"
          git pull --rebase
          git push

      # Upload the entire repo root as the Pages artifact (index.html, css/, js/).
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # Deploy the artifact to GitHub Pages.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
