name: Periodic Build & Deploy

# Runs once daily at 11:05 UTC (7 AM ET).  Can also be triggered manually.
on:
  schedule:
    - cron: '5 11 * * *'
  workflow_dispatch:
    inputs:
      update_type:
        description: 'Update type: routine refresh, or structural research proposal (never direct page rewrites)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - routine
          - structural

# Required for committing back to the repo and for GitHub Pages deployment.
permissions:
  contents: write
  pages: write
  id-token: write

# Only one deployment should run at a time; cancel any in-progress run when a
# new one is triggered (e.g. from a manual dispatch overlapping the scheduler).
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    outputs:
      ai_update_failed: ${{ steps.ai_update.outcome == 'failure' }}

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # Update data.json → date and lastUpdated to today's UTC date/time.
      - name: Update date in data.json
        run: node scripts/update-date.js

      # Refresh only the five-item material-change feed. Standing synthesis,
      # page architecture, Atlas design, and map presentation are protected.
      - name: Editorial latest-feed update
        id: ai_update
        continue-on-error: true
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          UPDATE_TYPE: ${{ github.event.inputs.update_type || 'auto' }}
        run: node scripts/ai-update.js

      # Regenerate index.html from the updated data.json and section files.
      - name: Build index.html
        run: npm run build

      # Cross-platform validation covers all 11 original and 11 Atlas outputs,
      # the compact latest feed, navigation, unresolved templates, and the
      # editorial automation locks.
      - name: Validate build output
        run: npm run validate

      # Fix #10: Tag the pre-update state for easy rollback.
      - name: Tag pre-update state for rollback
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Delete previous rollback tag if it exists, then create a new one.
          git tag -d last-good-deploy 2>/dev/null || true
          git push origin :refs/tags/last-good-deploy 2>/dev/null || true
          git tag last-good-deploy

      # Commit the refreshed files back to the branch so the repo always
      # reflects the latest auto-generated output.
      - name: Commit and push updated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage only expected editorial data and generated outputs. The
          # updater cannot stage or mutate CSS, JavaScript, build composition,
          # the Atlas shell, map presentation, or standing synthesis.
          git add data.json data/update-manifest.json \
                 index.html classic.html diplomatic.html scenarios.html forces.html \
                 iran-military.html inside-iran.html reactions.html sources.html \
                 analysis.html opposition.html background.html \
                 atlas/index.html atlas/diplomatic.html atlas/scenarios.html \
                 atlas/forces.html atlas/iran-military.html atlas/inside-iran.html \
                 atlas/reactions.html atlas/sources.html atlas/analysis.html \
                 atlas/opposition.html atlas/background.html \
                 sections/last-24h.html
          if [ -d research/proposals ]; then
            git add research/proposals/
          fi

          # Commit only if there are changes
          git diff --staged --quiet || git commit -m "chore: daily rebuild $(date -u +'%Y-%m-%d')"

          # Push commit and rollback tag
          git push
          git push origin last-good-deploy

      # Upload the entire repo root as the Pages artifact (index.html, css/, js/).
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # Deploy the artifact to GitHub Pages.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Open a GitHub issue whenever the build-and-deploy job fails or the AI
  # content update step fails silently (continue-on-error).  The issue
  # includes a direct link to the run so failures are easy to investigate.
  notify-on-failure:
    needs: build-and-deploy
    if: always() && (needs.build-and-deploy.result == 'failure' || needs.build-and-deploy.outputs.ai_update_failed == 'true')
    runs-on: ubuntu-latest

    permissions:
      issues: write

    steps:
      - name: Create failure notification issue
        uses: actions/github-script@v7
        with:
          script: |
            const jobResult = '${{ needs.build-and-deploy.result }}';
            const aiUpdateFailed = '${{ needs.build-and-deploy.outputs.ai_update_failed }}' === 'true';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const date = new Date().toISOString().split('T')[0];

            const failures = [];
            if (jobResult === 'failure') {
              failures.push('The **build-and-deploy** job failed (a required step exited with an error).');
            }
            if (aiUpdateFailed) {
              failures.push('The **editorial latest-feed update** failed (Brave Search/OpenAI quota, network, or evidence-gate issue).');
            }

            const body = [
              `## Workflow run failure — ${date}`,
              '',
              `**Workflow:** ${context.workflow}`,
              `**Triggered by:** \`${context.eventName}\``,
              `**Run:** [View logs and details](${runUrl})`,
              '',
              '### What failed',
              ...failures.map(f => `- ${f}`),
              '',
              'Please check the run link above for full logs.',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Workflow failure: ${context.workflow} (${date})`,
              body,
            });
