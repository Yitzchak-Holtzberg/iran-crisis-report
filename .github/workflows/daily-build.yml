name: Periodic Build & Deploy

# Runs once daily at 11:05 UTC (7 AM ET).  Can also be triggered manually.
on:
  schedule:
    - cron: '5 11 * * *'
  workflow_dispatch:
    inputs:
      update_type:
        description: 'Update type: "auto" (alias for routine), "routine" (data/zones only), or "structural" (force section-level changes)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - routine
          - structural

# Required for committing back to the repo and for GitHub Pages deployment.
permissions:
  contents: write
  pages: write
  id-token: write

# Only one deployment should run at a time; cancel any in-progress run when a
# new one is triggered (e.g. from a manual dispatch overlapping the scheduler).
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    outputs:
      ai_update_failed: ${{ steps.ai_update.outcome == 'failure' }}

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # Update data.json → date and lastUpdated to today's UTC date/time.
      - name: Update date in data.json
        run: node scripts/update-date.js

      # Pull the latest news with Brave Search and update data.json + last-24h.html
      # via GPT-5-mini.  Uses continue-on-error so a quota or network issue
      # never blocks the date-refresh and rebuild from completing.
      - name: AI content update (Brave Search + GPT-5-mini)
        id: ai_update
        continue-on-error: true
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          UPDATE_TYPE: ${{ github.event.inputs.update_type || 'auto' }}
        run: node scripts/ai-update.js

      # Regenerate index.html from the updated data.json and section files.
      - name: Build index.html
        run: npm run build

      # Fix #7: Validate build output before deployment.
      - name: Validate build output
        run: |
          node build.js 2>&1 | tee /tmp/build-output.txt
          # Fail on critical issues: unresolved placeholders, unbalanced zones, or unbalanced HTML tags.
          if grep -qE 'unresolved placeholders|Unbalanced AI zone|Unbalanced HTML tags' /tmp/build-output.txt; then
            echo "::error::Build validation failed — blocking deployment"
            exit 1
          fi
          # Verify all 11 output files exist and are non-empty.
          for f in index.html diplomatic.html scenarios.html forces.html iran-military.html inside-iran.html reactions.html analysis.html opposition.html background.html sources.html; do
            if [ ! -s "$f" ]; then
              echo "::error::$f is missing or empty"
              exit 1
            fi
          done
          echo "✓ Build validation passed"

      # Fix #10: Tag the pre-update state for easy rollback.
      - name: Tag pre-update state for rollback
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Delete previous rollback tag if it exists, then create a new one.
          git tag -d last-good-deploy 2>/dev/null || true
          git push origin :refs/tags/last-good-deploy 2>/dev/null || true
          git tag last-good-deploy

      # Commit the refreshed files back to the branch so the repo always
      # reflects the latest auto-generated output.
      - name: Commit and push updated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Ensure we are up to date before generating new commits.
          # --autostash temporarily shelves any local changes so the rebase
          # succeeds even when prior steps (date update, AI update, build)
          # have left modified files in the working tree.
          git pull --rebase --autostash

          # Stage only known build outputs and data files
          git add data.json data/update-manifest.json \
                 index.html diplomatic.html scenarios.html forces.html \
                 iran-military.html inside-iran.html reactions.html sources.html \
                 analysis.html opposition.html background.html \
                 sections/ logs/ 2>/dev/null || true

          # Commit only if there are changes
          git diff --staged --quiet || git commit -m "chore: daily rebuild $(date -u +'%Y-%m-%d')"

          # Push commit and rollback tag
          git push
          git push origin last-good-deploy

      # Upload the entire repo root as the Pages artifact (index.html, css/, js/).
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # Deploy the artifact to GitHub Pages.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Open a GitHub issue whenever the build-and-deploy job fails or the AI
  # content update step fails silently (continue-on-error).  The issue
  # includes a direct link to the run so failures are easy to investigate.
  notify-on-failure:
    needs: build-and-deploy
    if: always() && (needs.build-and-deploy.result == 'failure' || needs.build-and-deploy.outputs.ai_update_failed == 'true')
    runs-on: ubuntu-latest

    permissions:
      issues: write

    steps:
      - name: Create failure notification issue
        uses: actions/github-script@v7
        with:
          script: |
            const jobResult = '${{ needs.build-and-deploy.result }}';
            const aiUpdateFailed = '${{ needs.build-and-deploy.outputs.ai_update_failed }}' === 'true';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const date = new Date().toISOString().split('T')[0];

            const failures = [];
            if (jobResult === 'failure') {
              failures.push('The **build-and-deploy** job failed (a required step exited with an error).');
            }
            if (aiUpdateFailed) {
              failures.push('The **AI content update** step failed (Brave Search/OpenAI quota or network issue).');
            }

            const body = [
              `## Workflow run failure — ${date}`,
              '',
              `**Workflow:** ${context.workflow}`,
              `**Triggered by:** \`${context.eventName}\``,
              `**Run:** [View logs and details](${runUrl})`,
              '',
              '### What failed',
              ...failures.map(f => `- ${f}`),
              '',
              'Please check the run link above for full logs.',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Workflow failure: ${context.workflow} (${date})`,
              body,
            });
