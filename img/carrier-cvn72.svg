<svg class="csg-diagram" viewBox="0 0 340 162" xmlns="http://www.w3.org/2000/svg" aria-label="USS Abraham Lincoln — Nimitz-class carrier profile">
      <defs>
        <linearGradient id="sky-cvn72" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#04101c"/>
          <stop offset="100%" stop-color="#0b1826"/>
        </linearGradient>
        <linearGradient id="sea-cvn72" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#05101c"/>
          <stop offset="100%" stop-color="#020810"/>
        </linearGradient>
        <linearGradient id="hull-cvn72" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#203248"/>
          <stop offset="100%" stop-color="#14223a"/>
        </linearGradient>
        <linearGradient id="deck-cvn72" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#1c2e4c"/>
          <stop offset="100%" stop-color="#122040"/>
        </linearGradient>
      </defs>
      <!-- Base background — fills transparent gaps (corners, section seams) -->
      <rect width="340" height="162" rx="6" fill="#04101c"/>
      <!-- Sky -->
      <rect width="340" height="74" fill="url(#sky-cvn72)" rx="6"/>
      <!-- Ocean -->
      <rect y="74" width="340" height="39" fill="url(#sea-cvn72)"/>
      <!-- Waterline -->
      <line x1="0" y1="74" x2="340" y2="74" stroke="#0e2238" stroke-width="1.2"/>
      <!-- Hull below waterline -->
      <path d="M 22 74 L 320 74 Q 332 74 334 81 Q 336 88 330 93 L 28 93 Q 19 92 17 84 Q 16 78 20 75 Z" fill="#071422" stroke="#102030" stroke-width="0.5"/>
      <!-- Hull above waterline (freeboard) -->
      <path d="M 20 65 L 318 65 Q 330 65 333 68 Q 335 71 330 74 L 20 74 Z" fill="url(#hull-cvn72)" stroke="#2a3e5a" stroke-width="0.5"/>
      <!-- Flight deck -->
      <path d="M 14 56 L 318 56 Q 332 56 336 59 Q 338 62 334 65 L 14 65 Z" fill="url(#deck-cvn72)" stroke="#2e4668" stroke-width="0.7"/>
      <!-- Deck edge highlight -->
      <line x1="14" y1="56.5" x2="336" y2="56.5" stroke="#4a6a90" stroke-width="0.5" opacity="0.5"/>
      <!-- Deck centerline / landing stripe -->
      <line x1="20" y1="60.5" x2="332" y2="60.5" stroke="#243860" stroke-width="0.4" stroke-dasharray="10,8"/>
      <!-- Island structure -->
      <rect x="216" y="34" width="40" height="22" rx="1" fill="#162840" stroke="#2a4268" stroke-width="0.8"/>
      <!-- Island upper level -->
      <rect x="220" y="30" width="32" height="4" rx="1" fill="#122036" stroke="#223858" stroke-width="0.5"/>
      <!-- Bridge windows -->
      <rect x="220" y="39" width="5" height="3.5" rx="0.5" fill="#091828"/>
      <rect x="228" y="39" width="5" height="3.5" rx="0.5" fill="#091828"/>
      <rect x="236" y="39" width="5" height="3.5" rx="0.5" fill="#091828"/>
      <rect x="244" y="39" width="5" height="3.5" rx="0.5" fill="#091828"/>
      <rect x="220" y="45" width="5" height="3" rx="0.5" fill="#091828" opacity="0.7"/>
      <rect x="228" y="45" width="5" height="3" rx="0.5" fill="#091828" opacity="0.7"/>
      <!-- Mast -->
      <line x1="236" y1="30" x2="236" y2="14" stroke="#2a4e7a" stroke-width="1.2"/>
      <!-- Antenna spreaders -->
      <line x1="224" y1="18" x2="248" y2="18" stroke="#2a4e7a" stroke-width="0.9"/>
      <line x1="228" y1="15" x2="244" y2="15" stroke="#2a4e7a" stroke-width="0.7"/>
      <!-- Radar dome -->
      <circle cx="236" cy="14" r="3" fill="none" stroke="#4a80b0" stroke-width="0.9"/>
      <line x1="236" y1="11" x2="236" y2="8" stroke="#3a6a98" stroke-width="0.7"/>
      <!-- Parked aircraft on deck (F/A-18 top-view: fuselage + swept wings + stabs) -->
      <g fill="none" stroke="#3a6898" stroke-linecap="round" opacity="0.8">
        <line x1="50" y1="56" x2="65" y2="56" stroke-width="1.8"/>
        <line x1="53" y1="56" x2="48" y2="52" stroke-width="1.1"/>
        <line x1="53" y1="56" x2="48" y2="60" stroke-width="1.1"/>
        <line x1="61" y1="56" x2="59" y2="53.5" stroke-width="0.9"/>
        <line x1="61" y1="56" x2="59" y2="58.5" stroke-width="0.9"/>
      </g>
      <g fill="none" stroke="#3a6898" stroke-linecap="round" opacity="0.8">
        <line x1="84" y1="56" x2="99" y2="56" stroke-width="1.8"/>
        <line x1="87" y1="56" x2="82" y2="52" stroke-width="1.1"/>
        <line x1="87" y1="56" x2="82" y2="60" stroke-width="1.1"/>
        <line x1="95" y1="56" x2="93" y2="53.5" stroke-width="0.9"/>
        <line x1="95" y1="56" x2="93" y2="58.5" stroke-width="0.9"/>
      </g>
      <g fill="none" stroke="#3a6898" stroke-linecap="round" opacity="0.8">
        <line x1="118" y1="56" x2="133" y2="56" stroke-width="1.8"/>
        <line x1="121" y1="56" x2="116" y2="52" stroke-width="1.1"/>
        <line x1="121" y1="56" x2="116" y2="60" stroke-width="1.1"/>
        <line x1="129" y1="56" x2="127" y2="53.5" stroke-width="0.9"/>
        <line x1="129" y1="56" x2="127" y2="58.5" stroke-width="0.9"/>
      </g>
      <!-- Aircraft launching from bow (tilted upward) -->
      <g fill="none" stroke="#4a80b8" stroke-linecap="round" opacity="0.55" transform="translate(326,52) rotate(-12)">
        <line x1="0" y1="0" x2="14" y2="0" stroke-width="1.8"/>
        <line x1="3" y1="0" x2="-2" y2="-3.5" stroke-width="1.1"/>
        <line x1="3" y1="0" x2="-2" y2="3.5" stroke-width="1.1"/>
        <line x1="10" y1="0" x2="8" y2="-2" stroke-width="0.9"/>
        <line x1="10" y1="0" x2="8" y2="2" stroke-width="0.9"/>
      </g>
      <!-- Catapult steam trail -->
      <path d="M 322 54 Q 328 50 332 45" stroke="#3a5e80" stroke-width="1.2" fill="none" stroke-dasharray="2,3" opacity="0.4"/>
      <!-- Sea waves -->
      <g stroke="#0c2038" stroke-width="0.7" fill="none" opacity="0.8">
        <path d="M 0 80 Q 24 78 48 80 Q 72 82 96 80"/>
        <path d="M 36 86 Q 68 84 100 86 Q 132 88 164 86"/>
        <path d="M 170 81 Q 202 79 234 81 Q 266 83 298 81"/>
        <path d="M 240 87 Q 270 85 300 87 Q 322 89 340 87"/>
      </g>
      <!-- Bow wake -->
      <path d="M 332 75 L 340 70" stroke="#122636" stroke-width="1" fill="none" opacity="0.5"/>
      <path d="M 332 75 L 340 80" stroke="#122636" stroke-width="1" fill="none" opacity="0.5"/>
      <!-- Caption -->
      <text x="170" y="107" text-anchor="middle" fill="#1c3d60" font-size="7" font-family="JetBrains Mono,monospace" letter-spacing="2">NIMITZ-CLASS NUCLEAR CARRIER — CVN-72</text>
      <!-- Range & distance info strip -->
      <line x1="0" y1="113" x2="340" y2="113" stroke="#0e2238" stroke-width="0.8"/>
      <rect x="0" y="113" width="340" height="49" fill="#030b18"/>
      <!-- Distance badge -->
      <rect x="8" y="119" width="88" height="14" rx="7" fill="rgba(74,144,217,0.12)" stroke="rgba(74,144,217,0.35)" stroke-width="0.7"/>
      <text x="52" y="129" text-anchor="middle" fill="#4a90d9" font-size="8" font-family="JetBrains Mono,monospace" font-weight="700">700 KM · IRAN</text>
      <!-- Divider -->
      <line x1="106" y1="116" x2="106" y2="143" stroke="#0e2238" stroke-width="0.5"/>
      <!-- Tomahawk range — IN RANGE -->
      <text x="112" y="124.5" fill="#4a7090" font-size="6.5" font-family="JetBrains Mono,monospace" letter-spacing="0.5">TOMAHAWK BGM-109</text>
      <text x="112" y="135" fill="#40a060" font-size="9.5" font-family="JetBrains Mono,monospace" font-weight="700">1,600 km ✓</text>
      <!-- Divider -->
      <line x1="222" y1="116" x2="222" y2="143" stroke="#0e2238" stroke-width="0.5"/>
      <!-- F/A-18 combat radius — MARGINAL -->
      <text x="228" y="124.5" fill="#4a7090" font-size="6.5" font-family="JetBrains Mono,monospace" letter-spacing="0.5">F/A-18E/F RADIUS</text>
      <text x="228" y="135" fill="#c8a030" font-size="9.5" font-family="JetBrains Mono,monospace" font-weight="700">720 km ⚡</text>
      <!-- Transit time row -->
      <line x1="0" y1="145" x2="340" y2="145" stroke="#0e2238" stroke-width="0.5"/>
      <text x="12" y="156" fill="#4a7090" font-size="6.5" font-family="JetBrains Mono,monospace" letter-spacing="0.5">⏱ TRANSIT TO IRAN  ·  20 KTS:</text>
      <text x="196" y="156" fill="#4a90d9" font-size="9" font-family="JetBrains Mono,monospace" font-weight="700">~19 HRS</text>
    </svg>
