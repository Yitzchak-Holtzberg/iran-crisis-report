<svg class="csg-diagram" viewBox="0 0 340 162" xmlns="http://www.w3.org/2000/svg" aria-label="USS Gerald R. Ford — Ford-class carrier profile">
      <defs>
        <linearGradient id="sky-cvn78" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#100804"/>
          <stop offset="100%" stop-color="#1c1208"/>
        </linearGradient>
        <linearGradient id="sea-cvn78" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0c0804"/>
          <stop offset="100%" stop-color="#040402"/>
        </linearGradient>
        <linearGradient id="hull-cvn78" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#2c1e10"/>
          <stop offset="100%" stop-color="#1a1006"/>
        </linearGradient>
        <linearGradient id="deck-cvn78" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#281808"/>
          <stop offset="100%" stop-color="#180e04"/>
        </linearGradient>
      </defs>
      <!-- Base background — fills transparent gaps (corners, section seams) -->
      <rect width="340" height="162" rx="6" fill="#100804"/>
      <!-- Sky -->
      <rect width="340" height="74" fill="url(#sky-cvn78)" rx="6"/>
      <!-- Ocean -->
      <rect y="74" width="340" height="39" fill="url(#sea-cvn78)"/>
      <!-- Waterline -->
      <line x1="0" y1="74" x2="340" y2="74" stroke="#381808" stroke-width="1.2"/>
      <!-- Hull below waterline -->
      <path d="M 22 74 L 320 74 Q 332 74 334 81 Q 336 88 330 93 L 28 93 Q 19 92 17 84 Q 16 78 20 75 Z" fill="#0a0602" stroke="#1a0a04" stroke-width="0.5"/>
      <!-- Hull above waterline (freeboard) -->
      <path d="M 20 65 L 318 65 Q 330 65 333 68 Q 335 71 330 74 L 20 74 Z" fill="url(#hull-cvn78)" stroke="#5a3010" stroke-width="0.5"/>
      <!-- Flight deck -->
      <path d="M 14 56 L 318 56 Q 332 56 336 59 Q 338 62 334 65 L 14 65 Z" fill="url(#deck-cvn78)" stroke="#7a3e14" stroke-width="0.7"/>
      <!-- Deck edge highlight -->
      <line x1="14" y1="56.5" x2="336" y2="56.5" stroke="#c06830" stroke-width="0.5" opacity="0.5"/>
      <!-- Deck centerline / landing stripe -->
      <line x1="20" y1="60.5" x2="332" y2="60.5" stroke="#3a2010" stroke-width="0.4" stroke-dasharray="10,8"/>
      <!-- Island structure (Ford-class — more compact, further aft) -->
      <rect x="220" y="34" width="36" height="22" rx="1" fill="#221408" stroke="#7a3e14" stroke-width="0.8"/>
      <!-- Island upper level -->
      <rect x="224" y="30" width="28" height="4" rx="1" fill="#1c1006" stroke="#5a2e0e" stroke-width="0.5"/>
      <!-- Bridge windows -->
      <rect x="224" y="39" width="5" height="3.5" rx="0.5" fill="#0e0804"/>
      <rect x="232" y="39" width="5" height="3.5" rx="0.5" fill="#0e0804"/>
      <rect x="240" y="39" width="5" height="3.5" rx="0.5" fill="#0e0804"/>
      <rect x="224" y="45" width="5" height="3" rx="0.5" fill="#0e0804" opacity="0.7"/>
      <rect x="232" y="45" width="5" height="3" rx="0.5" fill="#0e0804" opacity="0.7"/>
      <!-- Mast -->
      <line x1="238" y1="30" x2="238" y2="14" stroke="#9a5020" stroke-width="1.2"/>
      <!-- Antenna spreaders -->
      <line x1="226" y1="18" x2="250" y2="18" stroke="#9a5020" stroke-width="0.9"/>
      <line x1="230" y1="15" x2="246" y2="15" stroke="#9a5020" stroke-width="0.7"/>
      <!-- Radar dome -->
      <circle cx="238" cy="14" r="3" fill="none" stroke="#d07030" stroke-width="0.9"/>
      <line x1="238" y1="11" x2="238" y2="8" stroke="#b05820" stroke-width="0.7"/>
      <!-- Parked aircraft on deck (F-35C top-view: delta wing) -->
      <g fill="none" stroke="#8a5018" stroke-linecap="round" opacity="0.8">
        <line x1="50" y1="56" x2="65" y2="56" stroke-width="1.8"/>
        <line x1="52" y1="56" x2="47" y2="52" stroke-width="1.1"/>
        <line x1="52" y1="56" x2="47" y2="60" stroke-width="1.1"/>
        <line x1="62" y1="56" x2="60" y2="54" stroke-width="0.9"/>
        <line x1="62" y1="56" x2="60" y2="58" stroke-width="0.9"/>
      </g>
      <g fill="none" stroke="#8a5018" stroke-linecap="round" opacity="0.8">
        <line x1="84" y1="56" x2="99" y2="56" stroke-width="1.8"/>
        <line x1="86" y1="56" x2="81" y2="52" stroke-width="1.1"/>
        <line x1="86" y1="56" x2="81" y2="60" stroke-width="1.1"/>
        <line x1="96" y1="56" x2="94" y2="54" stroke-width="0.9"/>
        <line x1="96" y1="56" x2="94" y2="58" stroke-width="0.9"/>
      </g>
      <g fill="none" stroke="#8a5018" stroke-linecap="round" opacity="0.8">
        <line x1="118" y1="56" x2="133" y2="56" stroke-width="1.8"/>
        <line x1="120" y1="56" x2="115" y2="52" stroke-width="1.1"/>
        <line x1="120" y1="56" x2="115" y2="60" stroke-width="1.1"/>
        <line x1="130" y1="56" x2="128" y2="54" stroke-width="0.9"/>
        <line x1="130" y1="56" x2="128" y2="58" stroke-width="0.9"/>
      </g>
      <!-- Aircraft launching from bow -->
      <g fill="none" stroke="#c07030" stroke-linecap="round" opacity="0.55" transform="translate(326,52) rotate(-12)">
        <line x1="0" y1="0" x2="14" y2="0" stroke-width="1.8"/>
        <line x1="3" y1="0" x2="-2" y2="-3.5" stroke-width="1.1"/>
        <line x1="3" y1="0" x2="-2" y2="3.5" stroke-width="1.1"/>
        <line x1="10" y1="0" x2="8" y2="-2" stroke-width="0.9"/>
        <line x1="10" y1="0" x2="8" y2="2" stroke-width="0.9"/>
      </g>
      <!-- Catapult steam trail -->
      <path d="M 322 54 Q 328 50 332 45" stroke="#9a5020" stroke-width="1.2" fill="none" stroke-dasharray="2,3" opacity="0.4"/>
      <!-- Sea waves -->
      <g stroke="#2a1408" stroke-width="0.7" fill="none" opacity="0.8">
        <path d="M 0 80 Q 24 78 48 80 Q 72 82 96 80"/>
        <path d="M 36 86 Q 68 84 100 86 Q 132 88 164 86"/>
        <path d="M 170 81 Q 202 79 234 81 Q 266 83 298 81"/>
        <path d="M 240 87 Q 270 85 300 87 Q 322 89 340 87"/>
      </g>
      <!-- Bow wake -->
      <path d="M 332 75 L 340 70" stroke="#3a1e08" stroke-width="1" fill="none" opacity="0.5"/>
      <path d="M 332 75 L 340 80" stroke="#3a1e08" stroke-width="1" fill="none" opacity="0.5"/>
      <!-- Caption -->
      <text x="170" y="107" text-anchor="middle" fill="#6a3a18" font-size="7" font-family="JetBrains Mono,monospace" letter-spacing="2">FORD-CLASS NUCLEAR CARRIER — CVN-78</text>
      <!-- Range & distance info strip -->
      <line x1="0" y1="113" x2="340" y2="113" stroke="#38180a" stroke-width="0.8"/>
      <rect x="0" y="113" width="340" height="49" fill="#080402"/>
      <!-- Distance badge -->
      <rect x="8" y="119" width="100" height="14" rx="7" fill="rgba(220,100,30,0.12)" stroke="rgba(220,100,30,0.35)" stroke-width="0.7"/>
      <text x="58" y="129" text-anchor="middle" fill="#e08c42" font-size="8" font-family="JetBrains Mono,monospace" font-weight="700">~2,000 KM · IRAN</text>
      <!-- Divider -->
      <line x1="118" y1="116" x2="118" y2="143" stroke="#38180a" stroke-width="0.5"/>
      <!-- Tomahawk range — STANDOFF (out of range) -->
      <text x="124" y="124.5" fill="#8a5030" font-size="6.5" font-family="JetBrains Mono,monospace" letter-spacing="0.5">TOMAHAWK BGM-109</text>
      <text x="124" y="135" fill="#d05030" font-size="9.5" font-family="JetBrains Mono,monospace" font-weight="700">1,600 km ✗</text>
      <!-- Divider -->
      <line x1="234" y1="116" x2="234" y2="143" stroke="#38180a" stroke-width="0.5"/>
      <!-- F-35C combat radius — STANDOFF -->
      <text x="240" y="124.5" fill="#8a5030" font-size="6.5" font-family="JetBrains Mono,monospace" letter-spacing="0.5">F-35C RADIUS</text>
      <text x="240" y="135" fill="#d05030" font-size="9.5" font-family="JetBrains Mono,monospace" font-weight="700">1,100 km ✗</text>
      <!-- Transit time row -->
      <line x1="0" y1="145" x2="340" y2="145" stroke="#38180a" stroke-width="0.5"/>
      <text x="12" y="156" fill="#8a5030" font-size="6.5" font-family="JetBrains Mono,monospace" letter-spacing="0.5">⏱ TRANSIT TO IRAN  ·  20 KTS:</text>
      <text x="196" y="156" fill="#e08c42" font-size="9" font-family="JetBrains Mono,monospace" font-weight="700">~54 HRS (~2.3 DAYS)</text>
    </svg>
