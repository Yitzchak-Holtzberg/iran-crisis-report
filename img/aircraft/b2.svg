<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- B-2 Spirit – Technical 3-view line drawing, dark theme -->
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="460" viewBox="0 0 700 460">
  <rect width="100%" height="100%" fill="#060810"/>

  <!-- ============================================================ -->
  <!-- TOP VIEW (planform) – PRIMARY VIEW, left-center -->
  <!-- B-2 is most recognizable top-down: the flying wing W-shape   -->
  <!-- ============================================================ -->
  <g stroke="#ff3b3b" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Flying wing planform outline -->
    <!-- Leading edge: smooth arc from tip to tip via nose -->
    <path d="
      M 40,340
      C 60,260  100,200  140,170
      C 170,150  200,140  230,135
      C 250,132  270,131  290,131
      L 350,131
      C 370,131  390,132  410,135
      C 440,140  470,150  500,170
      C 540,200  580,260  600,340
      L 570,340
      C 555,300  530,260  505,235
      C 485,215  460,200  435,195
      L 415,193
      C 405,192  400,192  395,193
      C 385,195  375,202  368,212
      C 360,222  355,232  352,242
      L 348,242
      C 345,232  340,222  332,212
      C 325,202  315,195  305,193
      C 300,192  295,192  285,193
      L 265,195
      C 240,200  215,215  195,235
      C 170,260  145,300  130,340
      Z
    "/>
    <!-- W-shaped trailing edge (characteristic feature) -->
    <path d="
      M 130,340
      C 155,330  185,325  215,326
      L 265,335
      C 280,338  295,342  310,343
      L 348,342
      L 352,342
      L 390,343
      C 405,342  420,338  435,335
      L 485,326
      C 515,325  545,330  570,340
    " stroke-width="2.5"/>
    <!-- Center body hump (slight raised area over engines) -->
    <path d="M 285,193 C 300,185 320,182 350,181 C 380,182 400,185 415,193" stroke-width="1"/>
    <!-- Engine exhaust slots (4 engines, flush in upper surface) -->
    <rect x="295" y="220" width="20" height="30" rx="3"/>
    <rect x="325" y="220" width="20" height="30" rx="3"/>
    <rect x="355" y="220" width="20" height="30" rx="3"/>
    <rect x="385" y="220" width="20" height="30" rx="3"/>
    <!-- Wing surface panel lines -->
    <path d="M 140,170 L 180,320" stroke-width="0.8" stroke-dasharray="6,4"/>
    <path d="M 210,145 L 230,315" stroke-width="0.8" stroke-dasharray="6,4"/>
    <path d="M 560,170 L 520,320" stroke-width="0.8" stroke-dasharray="6,4"/>
    <path d="M 490,145 L 470,315" stroke-width="0.8" stroke-dasharray="6,4"/>
    <!-- Cockpit (two small bumps on leading edge) -->
    <path d="M 330,140 C 335,133 345,130 350,130 C 355,130 365,133 370,140" stroke-width="1.5"/>
    <!-- Centerline -->
    <line x1="350" y1="131" x2="350" y2="342" stroke-width="0.7" stroke-dasharray="4,3" opacity="0.5"/>
  </g>

  <!-- Top-view label -->
  <text x="30" y="375" fill="#ff3b3b" font-family="monospace" font-size="11" opacity="0.7">TOP (PLANFORM)</text>
  <line x1="30" y1="380" x2="640" y2="380" stroke="#ff3b3b" stroke-width="0.5" opacity="0.3"/>

  <!-- ============================================================ -->
  <!-- SIDE VIEW – lower portion -->
  <!-- B-2 from side: just a thin wedge shape, very low profile     -->
  <!-- ============================================================ -->
  <g stroke="#ff3b3b" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Side profile: thin, wedge-shaped cross-section -->
    <path d="
      M 140,420
      C 180,408  240,402  290,401
      L 410,401
      C 460,402  520,408  560,420
      C 520,428  460,432  410,432
      C 390,434  370,438  350,440
      C 330,438  310,434  290,432
      C 240,432  180,428  140,420 Z
    "/>
    <!-- Cockpit humps (two blisters) -->
    <path d="M 290,401 C 310,395 330,392 350,392 C 370,392 390,395 410,401"/>
    <!-- Exhaust slots visible from side (rear center) -->
    <rect x="330" y="402" width="8" height="12" rx="2"/>
    <rect x="345" y="402" width="8" height="12" rx="2"/>
    <rect x="360" y="402" width="8" height="12" rx="2"/>
    <rect x="375" y="402" width="8" height="12" rx="2"/>
  </g>
  <text x="30" y="398" fill="#ff3b3b" font-family="monospace" font-size="11" opacity="0.7">SIDE</text>

  <!-- Aircraft label -->
  <text x="30" y="455" fill="#ff3b3b" font-family="monospace" font-size="13" font-weight="bold">B-2A Spirit</text>
  <text x="220" y="455" fill="#ff3b3b" font-family="monospace" font-size="10" opacity="0.6">Stealth Flying Wing Strategic Bomber · No Vertical Stabilizers</text>
</svg>
