       Wing root LE  (113,107)  Crank  (201,50)  Tip LE (228,10)
       Tip TE (242,12)  Root TE (283,109)
       HS root LE (287,110)  HS tip LE (319,70)  HS root TE (307,111)
       ═══════════════════════════════════════════════════════════════ -->

