  <text x="176" y="237" class="tt" text-anchor="middle" font-size="8.5px">PROFILE VIEW (PORT SIDE)</text>
  <text x="527" y="17"  class="tt" text-anchor="middle" font-size="10px" letter-spacing="2">F-35A LIGHTNING II</text>
  <text x="527" y="29"  class="tt" text-anchor="middle" font-size="6.5px" letter-spacing="2.5">LOCKHEED MARTIN · BAE SYSTEMS · NORTHROP GRUMMAN</text>
  <text x="527" y="46"  class="tt" text-anchor="middle" font-size="8.5px">FRONT VIEW</text>

  <!-- view dividers -->
  <line x1="358" y1="5"   x2="358" y2="455" class="da2"/>
  <line x1="5"   y1="232" x2="352" y2="232" class="da2"/>

  <!-- corner marks -->
  <path class="pl" d="M 5,5 L 20,5 M 5,5 L 5,20"/>
  <path class="pl" d="M 695,5 L 680,5 M 695,5 L 695,20"/>
  <path class="pl" d="M 5,455 L 20,455 M 5,455 L 5,440"/>
  <path class="pl" d="M 695,455 L 680,455 M 695,455 L 695,440"/>


