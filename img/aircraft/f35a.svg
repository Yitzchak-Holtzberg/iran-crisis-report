<svg xmlns="http://www.w3.org/2000/svg" width="700" height="460" viewBox="0 0 700 460">
  <defs>
    <style>
      .ol  { fill:none; stroke:#00d4ff; stroke-width:1.2; stroke-linecap:round; stroke-linejoin:round }
      .ol2 { fill:none; stroke:#00d4ff; stroke-width:0.8; stroke-linecap:round; stroke-linejoin:round }
      .pl  { fill:none; stroke:#00d4ff; stroke-width:0.5; stroke-linecap:round; stroke-linejoin:round }
      .da  { fill:none; stroke:#00d4ff; stroke-width:0.5; stroke-dasharray:3,2; stroke-linecap:round }
      .da2 { fill:none; stroke:#00d4ff; stroke-width:0.3; stroke-dasharray:6,4; opacity:0.35 }
