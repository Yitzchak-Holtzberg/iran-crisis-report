    M 22,117
    C 40,114 62,110 84,107
    C 92,105 100,102 108,102
    C 111,103 113,105 113,107
    L 201,50
    L 228,10
    L 233,9
    A 4,3 0 0,0 242,13
    L 283,109
    L 287,110
    L 319,70
    L 327,72
    L 307,111
    C 314,113 328,116 342,117
    C 328,118 314,121 307,123
    L 327,162
    L 319,164
    L 287,124
    L 283,125
    L 242,221
    A 4,3 0 0,1 233,225
    L 228,224
    L 201,184
    L 113,127
    C 113,129 111,131 108,132
    C 100,132 92,129 84,127
