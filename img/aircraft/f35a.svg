  <text x="258"  y="399"  class="lb">W/TE</text>

  <text x="330"  y="356"  class="lb">NOZZLE</text>


  <!-- ═══════════════════════════════════════════════════════════════
       FRONT VIEW
       Centre x=530  Wing-root y=315  Scale ≈ 28 px/m
