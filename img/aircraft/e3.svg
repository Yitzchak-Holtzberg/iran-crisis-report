<svg xmlns="http://www.w3.org/2000/svg" width="700" height="460" viewBox="0 0 700 460">
  <defs><style>
    .ol{fill:none;stroke:#4a90d9;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
    .ol2{fill:none;stroke:#4a90d9;stroke-width:0.8;stroke-linecap:round;stroke-linejoin:round}
    .pl{fill:none;stroke:#4a90d9;stroke-width:0.5;stroke-linecap:round;stroke-linejoin:round}
    .da{fill:none;stroke:#4a90d9;stroke-width:0.5;stroke-dasharray:3,2;stroke-linecap:round}
    .da2{fill:none;stroke:#4a90d9;stroke-width:0.3;stroke-dasharray:6,4;opacity:0.35}
    .lb{fill:#4a90d9;font-family:'Courier New',monospace;font-size:7px}
    .tt{fill:#4a90d9;font-family:'Courier New',monospace;letter-spacing:1px}
    .dt{fill:#4a90d9}
    .tk{fill:none;stroke:#4a90d9;stroke-width:0.7}
  </style></defs>
  <rect width="700" height="460" fill="#060810"/>
  <text x="176" y="13" class="tt" text-anchor="middle" font-size="8.5px">PLAN VIEW (TOP)</text>
  <text x="176" y="237" class="tt" text-anchor="middle" font-size="8.5px">PROFILE VIEW (PORT SIDE)</text>
  <text x="527" y="17" class="tt" text-anchor="middle" font-size="10px" letter-spacing="2">E-3 SENTRY AWACS</text>
  <text x="527" y="29" class="tt" text-anchor="middle" font-size="6.5px" letter-spacing="2.5">BOEING 707-320 · WESTINGHOUSE APY-2</text>
  <text x="527" y="46" class="tt" text-anchor="middle" font-size="8.5px">FRONT VIEW</text>
  <line x1="358" y1="5" x2="358" y2="455" class="da2"/>
  <line x1="5" y1="232" x2="352" y2="232" class="da2"/>
  <path class="pl" d="M 5,5 L 20,5 M 5,5 L 5,20"/>
  <path class="pl" d="M 695,5 L 680,5 M 695,5 L 695,20"/>
  <path class="pl" d="M 5,455 L 20,455 M 5,455 L 5,440"/>
  <path class="pl" d="M 695,455 L 680,455 M 695,455 L 695,440"/>
  <!-- TOP VIEW: scale 5px/m, CL y=117, nose x=12, tail x=245 -->
  <!-- Rotodome: large circle (r=23) centred at (117,117) -->
  <circle cx="117" cy="117" r="23" class="ol"/>
  <circle cx="117" cy="117" r="19" class="pl"/>
  <circle cx="104" cy="117" r="3.5" class="ol2"/>
  <circle cx="130" cy="117" r="3.5" class="ol2"/>
  <!-- rotodome strut (thin lines from disc to fuselage) -->
  <line x1="94" y1="116" x2="82" y2="116" class="ol2"/>
  <line x1="94" y1="118" x2="82" y2="118" class="ol2"/>
  <!-- main planform: 707-style swept wing (35-deg LE sweep) -->
  <!-- nose x=12, fuselage half-width 9px (y=108/126) -->
  <!-- wing root LE x=87 at y=108/126; tip LE x=158 at y=6/228 -->
  <!-- root chord 49px (root TE x=136); tip chord 12px (tip TE x=170) -->
  <path class="ol" d="
    M 12,117
    C 16,115 18,112 20,109 L 20,108 L 87,108
    L 158,6 L 170,6 L 136,108
    L 227,108 C 234,111 240,114 245,117
    C 240,120 234,123 227,126 L 136,126
    L 170,228 L 158,228 L 87,126 L 20,126 L 20,126
    C 18,123 16,119 12,117 Z"/>
  <line x1="12" y1="117" x2="245" y2="117" class="da"/>
  <!-- engine nacelles (top view, 4 pods) -->
  <!-- stbd inner (y=57, x=137) outer (y=17, x=158) -->
  <ellipse cx="137" cy="57" rx="7" ry="3" class="ol2"/>
  <ellipse cx="158" cy="17" rx="6" ry="2.5" class="ol2"/>
  <!-- port inner (y=177) outer (y=217) -->
  <ellipse cx="137" cy="177" rx="7" ry="3" class="ol2"/>
  <ellipse cx="158" cy="217" rx="6" ry="2.5" class="ol2"/>
  <!-- pylon lines from wing to nacelles -->
  <line x1="137" y1="90" x2="137" y2="60" class="pl"/>
  <line x1="137" y1="144" x2="137" y2="174" class="pl"/>
  <line x1="158" y1="34" x2="158" y2="20" class="pl"/>
  <line x1="158" y1="200" x2="158" y2="214" class="pl"/>
  <!-- wing structural lines stbd -->
  <line x1="108" y1="95" x2="162" y2="12" class="pl"/>
  <line x1="122" y1="82" x2="166" y2="9" class="pl"/>
  <!-- wing structural lines port -->
  <line x1="108" y1="139" x2="162" y2="222" class="pl"/>
  <line x1="122" y1="152" x2="166" y2="225" class="pl"/>
  <!-- vertical tail from above (rectangle near tail) -->
  <rect x="218" y="114" width="20" height="6" class="ol2" rx="0.5"/>
  <!-- nose radome -->
  <ellipse cx="14" cy="117" rx="5" ry="9" class="ol2"/>
  <!-- tick marks -->
  <line x1="12" y1="111" x2="12" y2="123" class="tk"/>
  <line x1="245" y1="111" x2="245" y2="123" class="tk"/>
  <line x1="152" y1="0" x2="172" y2="0" class="tk"/>
  <line x1="152" y1="234" x2="172" y2="234" class="tk"/>
  <!-- annotation dots -->
  <circle cx="12" cy="117" r="1.8" class="dt"/>
  <circle cx="245" cy="117" r="1.8" class="dt"/>
  <circle cx="158" cy="6" r="1.8" class="dt"/>
  <circle cx="158" cy="228" r="1.8" class="dt"/>
  <!-- sweep angle -->
  <text x="99" y="84" class="lb">35°</text>
  <line x1="99" y1="86" x2="106" y2="93" class="pl"/>
  <!-- labels -->
  <text x="108" y="91" class="lb">ROTODOME</text>
  <text x="109" y="98" class="lb">9.1 m DIA</text>
  <text x="131" y="52" class="lb">ENG 3</text>
  <text x="152" y="12" class="lb">ENG 4</text>
  <text x="218" y="112" class="lb">V-TAIL</text>
  <!-- SIDE VIEW: scale 5px/m, datum y=366, nose x=12, tail x=245 -->
  <!-- Fuselage top y=357, belly y=384 -->
  <!-- VT tip y=302, rotodome pylon 17px, disc r=23 -> RD centre y=317 -->
  <!-- main fuselage profile (707 - long cylinder with tapered nose) -->
  <path class="ol" d="
    M 12,370
    C 14,362 17,358 22,357 L 22,357 L 227,357
    C 232,357 238,359 241,362 A 9,9 0 0,1 241,370
    A 9,9 0 0,1 241,377 C 236,380 231,382 228,382 L 22,382
    C 18,382 14,380 12,374 Z"/>
  <!-- rotodome pylon -->
  <rect x="113" y="340" width="8" height="17" class="ol2" rx="1"/>
  <!-- rotodome disc (large circle, the most distinctive AWACS feature) -->
  <circle cx="117" cy="317" r="23" class="ol"/>
  <circle cx="117" cy="317" r="19" class="pl"/>
  <!-- rotodome fore/aft end caps -->
  <ellipse cx="94" cy="317" rx="5" ry="4" class="ol2"/>
  <ellipse cx="140" cy="317" rx="5" ry="4" class="ol2"/>
  <!-- 4 engine nacelles in side view (pods below wing with pylons) -->
  <!-- inner nacelle -->
  <rect x="130" y="370" width="14" height="7" class="ol2" rx="2"/>
  <line x1="133" y1="367" x2="133" y2="370" class="pl"/>
  <line x1="141" y1="367" x2="141" y2="370" class="pl"/>
  <!-- outer nacelle (further out on wing, slightly aft) -->
  <rect x="152" y="371" width="12" height="6" class="ol2" rx="2"/>
  <line x1="155" y1="368" x2="155" y2="371" class="pl"/>
  <line x1="162" y1="368" x2="162" y2="371" class="pl"/>
  <!-- wing root/tip indicator lines -->
  <line x1="87" y1="357" x2="87" y2="377" class="ol2"/>
  <line x1="170" y1="357" x2="170" y2="378" class="ol2"/>
  <path class="pl" d="M 87,357 C 108,354 148,353 170,356"/>
  <line x1="87" y1="378" x2="168" y2="378" class="pl"/>
  <!-- vertical tail (large swept surface) -->
  <path class="ol" d="
    M 218,357 L 210,347 L 207,330 L 209,318 L 214,305 L 221,302
    L 228,306 L 232,318 L 231,332 L 228,357 Z"/>
  <line x1="210" y1="351" x2="218" y2="304" class="pl"/>
  <line x1="215" y1="305" x2="231" y2="348" class="pl"/>
  <!-- horizontal stabiliser -->
  <path class="ol2" d="M 228,374 L 244,370 L 245,376 L 229,379 Z"/>
  <!-- fuselage window row -->
  <path class="pl" d="M 28,362 L 218,362"/>
  <!-- nose radome (rounded) -->
  <path class="ol2" d="M 12,366 C 12,363 13,360 15,358 C 17,356 20,356 22,357"/>
  <path class="ol2" d="M 12,374 C 12,377 14,380 16,381 C 18,382 20,382 22,382"/>
  <!-- datum reference line -->
  <line x1="12" y1="366" x2="245" y2="366" class="da" opacity="0.4"/>
  <!-- station lines -->
  <line x1="44" y1="357" x2="46" y2="382" class="pl"/>
  <line x1="84" y1="357" x2="86" y2="382" class="pl"/>
  <line x1="170" y1="357" x2="172" y2="382" class="pl"/>
  <line x1="208" y1="357" x2="210" y2="382" class="pl"/>
  <!-- tick marks side view -->
  <line x1="6" y1="370" x2="18" y2="370" class="tk"/>
  <line x1="239" y1="360" x2="247" y2="372" class="tk"/>
  <line x1="206" y1="296" x2="228" y2="296" class="tk"/>
  <line x1="85" y1="351" x2="85" y2="385" class="tk"/>
  <line x1="172" y1="351" x2="172" y2="386" class="tk"/>
  <line x1="94" y1="291" x2="140" y2="291" class="tk"/>
  <!-- annotation dots side view -->
  <circle cx="12" cy="370" r="1.8" class="dt"/>
  <circle cx="241" cy="366" r="1.8" class="dt"/>
  <circle cx="219" cy="302" r="1.8" class="dt"/>
  <circle cx="117" cy="317" r="1.8" class="dt"/>
  <!-- labels side view -->
  <text x="206" y="294" class="lb">VT TIP</text>
  <text x="204" y="301" class="lb">h=12.73m</text>
  <line x1="140" y1="289" x2="156" y2="295" class="pl"/>
  <text x="142" y="288" class="lb">ROTODOME</text>
  <text x="143" y="295" class="lb">9.1 m DIA</text>
  <text x="128" y="384" class="lb">ENG 2/3</text>
  <text x="150" y="385" class="lb">ENG 1/4</text>
  <text x="16" y="354" class="lb">707-STYLE FUSELAGE</text>
  <text x="89" y="390" class="lb">W/LE</text>
  <text x="164" y="390" class="lb">W/TE</text>
  <!-- FRONT VIEW: scale 4px/m, centre x=527 -->
  <!-- Wing semi-span: 22.21m*4=89px -> tips x=438, x=616 -->
  <!-- Fuselage radius: 1.88m*4=8px -->
  <!-- VT height: 12.73m*4=51px -->
  <!-- Rotodome: pylon 14px, disc r=18px -->
  <!-- Fuselage centre y: 340 (roughly mid-front-view area) -->
  <!-- circular fuselage cross-section -->
  <circle cx="527" cy="340" r="9" class="ol"/>
  <!-- cockpit windows -->
  <ellipse cx="522" cy="333" rx="3" ry="2" class="ol2"/>
  <ellipse cx="532" cy="333" rx="3" ry="2" class="ol2"/>
  <!-- rotodome pylon -->
  <rect x="525" y="304" width="4" height="27" class="ol2" rx="1"/>
  <!-- rotodome disc -->
  <circle cx="527" cy="286" r="18" class="ol"/>
  <circle cx="527" cy="286" r="15" class="pl"/>
  <!-- rotodome end caps -->
  <ellipse cx="509" cy="286" rx="4" ry="3.5" class="ol2"/>
  <ellipse cx="545" cy="286" rx="4" ry="3.5" class="ol2"/>
  <!-- left (port) wing with slight positive dihedral -->
  <path class="ol" d="
    M 518,338 C 495,336 462,334 438,333
    L 438,337 C 462,338 495,340 519,342"/>
  <path class="ol" d="M 438,333 A 3,4 0 0,0 438,337"/>
  <!-- right (stbd) wing -->
  <path class="ol" d="
    M 536,338 C 559,336 592,334 616,333
    L 616,337 C 592,338 559,340 535,342"/>
  <path class="ol" d="M 616,333 A 3,4 0 0,1 616,337"/>
  <!-- 4 engine nacelles (front view) -->
  <ellipse cx="487" cy="341" rx="6" ry="3" class="ol2"/>
  <ellipse cx="463" cy="338" rx="5" ry="2.5" class="ol2"/>
  <ellipse cx="567" cy="341" rx="6" ry="3" class="ol2"/>
  <ellipse cx="591" cy="338" rx="5" ry="2.5" class="ol2"/>
  <!-- vertical tail (front view - thin strip) -->
  <path class="ol" d="
    M 524,331 L 524,289 L 530,289 L 530,331 Z"/>
  <!-- horizontal stabiliser -->
  <path class="ol2" d="M 518,345 L 482,347 L 482,351 L 519,349 Z"/>
  <path class="ol2" d="M 536,345 L 572,347 L 572,351 L 535,349 Z"/>
  <!-- centreline -->
  <line x1="527" y1="265" x2="527" y2="351" class="da" opacity="0.55"/>
  <!-- wingspan dimension line -->
  <line x1="434" y1="358" x2="620" y2="358" class="tk" opacity="0.35"/>
  <line x1="434" y1="355" x2="434" y2="361" class="tk"/>
  <line x1="620" y1="355" x2="620" y2="361" class="tk"/>
  <!-- VT height indicator -->
  <line x1="534" y1="289" x2="542" y2="289" class="tk"/>
  <line x1="534" y1="331" x2="542" y2="331" class="tk"/>
  <line x1="538" y1="289" x2="538" y2="331" class="tk" opacity="0.35"/>
  <!-- annotation dots front view -->
  <circle cx="527" cy="268" r="1.8" class="dt"/>
  <circle cx="438" cy="335" r="1.8" class="dt"/>
  <circle cx="616" cy="335" r="1.8" class="dt"/>
  <!-- labels front view -->
  <text x="527" y="370" class="lb" text-anchor="middle">WINGSPAN: 44.42 m</text>
  <text x="527" y="378" class="lb" text-anchor="middle">4× TF33 TURBOFAN (2 PER WING)</text>
  <text x="527" y="278" class="lb" text-anchor="middle">ROTODOME</text>
  <text x="424" y="340" class="lb" text-anchor="middle">PORT</text>
  <text x="424" y="347" class="lb" text-anchor="middle">TIP</text>
  <text x="630" y="340" class="lb" text-anchor="end">STBD</text>
  <text x="630" y="347" class="lb" text-anchor="end">TIP</text>
  <text x="543" y="293" class="lb">VT</text>
  <text x="543" y="300" class="lb">h=</text>
  <text x="543" y="307" class="lb">12.7m</text>
  <!-- DATA BLOCK -->
  <rect x="363" y="388" width="328" height="62" fill="none" stroke="#4a90d9" stroke-width="0.4" opacity="0.5"/>
  <line x1="363" y1="397" x2="691" y2="397" stroke="#4a90d9" stroke-width="0.3" opacity="0.4"/>
  <text x="527" y="395" class="tt" text-anchor="middle" font-size="7px" letter-spacing="1">SPECIFICATION DATA</text>
  <text x="370" y="406" class="lb">LENGTH    : 46.61 m</text>
  <text x="370" y="414" class="lb">WINGSPAN  : 44.42 m</text>
  <text x="370" y="422" class="lb">HEIGHT    : 12.73 m</text>
  <text x="370" y="430" class="lb">WING AREA : 283.4 m²</text>
  <text x="370" y="438" class="lb">WING LE Λ : 35°</text>
  <text x="370" y="446" class="lb">MTOW      : 151,315 kg</text>
  <text x="500" y="406" class="lb">ENGINES  : 4× TF33-PW-100A</text>
  <text x="500" y="414" class="lb">THRUST   : 93.4 kN each</text>
  <text x="500" y="422" class="lb">MAX SPD  : 853 km/h</text>
  <text x="500" y="430" class="lb">RANGE    : 9,250 km</text>
  <text x="500" y="438" class="lb">CEILING  : 12,200 m</text>
  <text x="500" y="446" class="lb">RADAR    : APY-2 360° rotodome</text>
  <line x1="614" y1="406" x2="664" y2="406" stroke="#4a90d9" stroke-width="0.7"/>
  <line x1="614" y1="403" x2="614" y2="409" stroke="#4a90d9" stroke-width="0.7"/>
  <line x1="664" y1="403" x2="664" y2="409" stroke="#4a90d9" stroke-width="0.7"/>
  <line x1="639" y1="403" x2="639" y2="409" stroke="#4a90d9" stroke-width="0.5"/>
  <text x="639" y="416" class="lb" text-anchor="middle">5 m</text>
  <text x="614" y="416" class="lb" text-anchor="middle">0</text>
  <text x="664" y="416" class="lb" text-anchor="middle">10 m</text>
  <text x="639" y="424" class="lb" text-anchor="middle">SCALE 1:∼200</text>
</svg>